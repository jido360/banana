<title>Muhammad El Khwaga – قارئ UART</title>
<style>
:root{--bg:#0C111B;--card:#131A27;--line:#243047;--text:#EAF0FA;--muted:#93A1B8;--accent:#5EA2FF;--ink:#06121F;--bad:#FF8A80}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif;display:flex;flex-direction:column;padding:16px;gap:12px}
header{display:flex;align-items:center;gap:12px}
h1{font-size:20px;margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
button,select{font:inherit;font-size:15px;border-radius:8px;border:1px solid #33425E;background:var(--card);color:var(--text);padding:9px 16px;min-height:44px}
button{cursor:pointer}
button.main{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{color:var(--muted);font-size:15px}
#status{color:var(--muted);font-size:15px;margin-inline-start:auto}
#status.on{color:var(--accent)}
#err{color:var(--bad);min-height:20px;font-size:15px}
#log{flex:1;min-height:240px;margin:0;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;direction:ltr;text-align:left;font:13px/1.5 'IBM Plex Mono',ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
header nav{display:flex;gap:20px}
header nav a{color:var(--muted);text-decoration:none;font-size:16px;padding:10px 4px}
header nav a:hover,header nav a[aria-current]{color:var(--accent)}
.brand{font-size:22px;font-weight:700}
.acct{margin-inline-start:auto;width:44px;padding:0;border-radius:50%;display:grid;place-items:center}
#analysis{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:38vh;overflow:auto}
#analysis h2{font-size:17px;margin:0 0 8px}
#summary{color:var(--muted);font-size:15px;line-height:1.7;margin-bottom:8px}
#findings{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:10px}
#findings li{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
#findings p{margin:4px 0 6px;font-size:15px;line-height:1.7}
#findings code{display:block;direction:ltr;text-align:left;color:var(--muted);font:12px/1.5 'IBM Plex Mono',ui-monospace,Consolas,monospace;word-break:break-all}
/* polish: layout */
body>*:not(#loader){width:100%;max-width:1100px;margin-inline:auto}
header{padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{letter-spacing:-.5px}
h1{font-size:24px}
footer{margin-top:auto;padding:20px 0 4px;text-align:center;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
footer b{color:var(--text)}
/* polish: controls */
button,.row,#log,#logview,#analysis{transition:transform .15s,background .15s,border-color .2s,filter .15s}
button:hover:not(:disabled){transform:translateY(-1px);border-color:var(--accent)}
button.main:hover:not(:disabled){filter:brightness(1.08)}
button:active:not(:disabled){transform:scale(.98)}
.row:hover{transform:translateY(-2px);border-color:var(--accent)}
#status{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px}
#status::before{content:"";width:8px;height:8px;border-radius:50%;background:#6B7280}
#status.on::before{background:var(--accent);animation:pulse 1.6s ease infinite}
/* polish: entrance */
header{animation:down .6s ease 1s both}
body>*:nth-child(3){animation:up .6s ease 1.05s both}
body>*:nth-child(4){animation:up .6s ease 1.12s both}
body>*:nth-child(5){animation:up .6s ease 1.19s both}
body>*:nth-child(6){animation:up .6s ease 1.26s both}
body>*:nth-child(n+7){animation:up .6s ease 1.33s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,162,255,.6)}70%{box-shadow:0 0 0 8px rgba(94,162,255,0)}100%{box-shadow:0 0 0 0 rgba(94,162,255,0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes loaderOut{to{opacity:0;visibility:hidden}}
/* polish: loading screen (about 1 second) */
#loader{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:loaderOut .4s ease 1s forwards}
#loader svg{width:64px;height:90px}
#loader .ld{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .9s ease .1s forwards}
#loader span{font-size:22px;font-weight:700;letter-spacing:-.5px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#loader{display:none}}
/* top bar v2 */
header{position:sticky;top:0;z-index:20;background:var(--bg);flex-wrap:wrap;gap:12px 24px}
.logo{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none}
.brand em{font-style:normal;color:var(--accent)}
.logo:hover .pl{stroke-dasharray:100;animation:blip .8s ease}
@keyframes blip{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
nav{display:flex;gap:18px;overflow-x:auto}
nav a.tab{position:relative;color:var(--muted);font-size:16px;padding:10px 2px;white-space:nowrap;text-decoration:none}
nav a.tab small{font-size:12px;color:var(--muted);margin-inline-start:4px}
nav a.tab::after{content:"";position:absolute;inset-inline:0;bottom:2px;height:2px;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .25s ease}
nav a.tab:hover,nav a.tab[aria-current]{color:var(--text)}
nav a.tab:hover::after,nav a.tab[aria-current]::after{transform:scaleX(1)}
[data-tip]{position:relative}
[data-tip]:hover::before{content:attr(data-tip);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--card);border:1px solid var(--accent);color:var(--text);font-size:13px;padding:6px 10px;border-radius:4px;z-index:40;pointer-events:none;animation:tipin .2s ease}
@keyframes tipin{from{opacity:0}to{opacity:1}}
.acctwrap{position:relative;margin-inline-start:auto}
.acct{margin-inline-start:0;transition:transform .2s,border-color .2s}
.acct:hover{transform:rotate(-8deg) scale(1.05)}
.menu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px;z-index:30;animation:up .18s ease both}
.menu button{display:block;width:100%;text-align:start;border:0;background:transparent;min-height:40px;border-radius:4px}
.menu button:hover:not(:disabled){background:#1A2438;transform:none}
#toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--card);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:6px;font-size:15px;opacity:0;transform:translateY(10px);transition:opacity .25s,transform .25s;pointer-events:none;z-index:200}
#toast.show{opacity:1;transform:none}
/* less generic: squarer shapes, mono labels */
button,select{border-radius:4px}
.row,#log,#logview,#analysis,#findings li{border-radius:6px}
#status{border-radius:4px;font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:13px}
footer{font-family:'IBM Plex Mono',ui-monospace,Consolas,monospace;font-size:13px}
/* friendlier layout */
.logbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.logbar .grow{flex:1}
.logbar button{min-height:36px;padding:5px 14px;font-size:14px}
#log{flex:none;height:clamp(180px,30vh,300px);min-height:0;padding:10px 12px;font-size:12.5px}
#log:empty::before{content:"لا يوجد سجل بعد. وصّل المحوّل ثم اضغط «اتصال».";display:block;text-align:center;padding-top:50px;color:var(--muted);direction:rtl;font:15px 'IBM Plex Sans Arabic',system-ui,'Segoe UI',Tahoma,sans-serif}
.big #log{height:68vh}
#analysis{max-height:260px}
.note{margin:0}
/* step boxes */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
body>.steps{animation:none!important}
.steps li:nth-child(1){--d:1.15s}.steps li:nth-child(2){--d:1.25s}.steps li:nth-child(3){--d:1.35s}
button.step{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;text-align:start;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:6px;color:var(--text);font-size:15px;line-height:1.5;animation:stepIn .5s ease var(--d,1.2s) both}
button.step:hover{border-color:var(--accent);transform:translateY(-2px)}
.step .num{flex:none;display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--accent);border-radius:4px;color:var(--accent);font:700 16px 'IBM Plex Mono',ui-monospace,Consolas,monospace;transition:background .25s,color .25s}
.step .chk{flex:none;margin-inline-start:auto;color:var(--accent);opacity:0;transform:scale(.4);transition:opacity .25s,transform .25s}
.step.active{border-color:var(--accent);animation:stepIn .5s ease var(--d,1.2s) both,glow 2.2s ease-in-out calc(var(--d,1.2s) + .6s) infinite}
.step.active .num{background:var(--accent);color:var(--ink)}
.step.done{border-color:var(--accent);background:#0F2038}
.step.done .num{background:var(--accent);color:var(--ink);animation:pop .35s ease}
.step.done .chk{opacity:1;transform:none}
@keyframes stepIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(94,162,255,0)}50%{box-shadow:0 0 0 4px rgba(94,162,255,.28)}}
@keyframes pop{50%{transform:scale(1.25)}}
/* analysis buttons instead of a scroll box */
#analysis{max-height:none;overflow:visible}
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0 10px}
.tabs .grow{flex:1}
[role="tab"]{min-height:40px}
[role="tab"][aria-selected="true"]{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:700}
[role="tabpanel"]{animation:up .25s ease both}
#findings,#suggestions{list-style:none;margin:0;padding:0;display:grid;gap:10px}
#suggestions li{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
#suggestions p{margin:4px 0 0;font-size:15px;line-height:1.7}
#findings li strong{display:block;margin-bottom:6px}
#findings:empty::before,#suggestions:empty::before{content:"لا توجد نتائج بعد.";display:block;text-align:center;padding:18px;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
#baudhint:empty{display:none}
#baud{max-width:100%}
.steps li:nth-child(4){--d:1.45s}
/* look v2: ink-blue palette, Plex fonts, panel toolbars */
html{color-scheme:dark}
body{font-weight:400}
button,select,input.cmd{border-radius:8px}
button{background:#1A2438;border:1px solid #2C3B57;font-weight:500;min-height:46px}
button:hover:not(:disabled){background:#202C45;border-color:var(--accent)}
button.main{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:700;padding:9px 22px}
button.main:hover:not(:disabled){background:#7DB4FF;border-color:#7DB4FF}
select{background:#1A2438;border-color:#2C3B57;min-height:46px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.logbar{gap:0}
.logbar strong{margin-inline-end:10px}
.logbar button{border-radius:0;min-height:38px}
.logbar button + button{margin-inline-start:-1px}
.logbar button:first-of-type{border-start-start-radius:8px;border-end-start-radius:8px}
.logbar button:last-of-type{border-start-end-radius:8px;border-end-end-radius:8px}
.logbar button:hover:not(:disabled){transform:none;position:relative;z-index:1}
.row,.tc,#log,#logview,#analysis,button.step,.menu{border-radius:10px}
h1,.h2,.gh{letter-spacing:-.2px}
h1{font-weight:700}
.brand{font-weight:700}
</style>
</head>

<script>
(function () {
  const t = document.getElementById('toast'); let tm;
  window.toast = m => { t.textContent = m; t.classList.add('show'); clearTimeout(tm); tm = setTimeout(() => t.classList.remove('show'), 2200); };
  const b = document.querySelector('.acct'), m = document.querySelector('.menu');
  const close = () => { m.hidden = true; b.setAttribute('aria-expanded', 'false'); };
  b.addEventListener('click', e => { e.stopPropagation(); const open = m.hidden; m.hidden = !open; b.setAttribute('aria-expanded', String(open)); });
  document.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  document.querySelectorAll('[data-toast]').forEach(el => el.addEventListener('click', e => { e.preventDefault(); window.toast(el.dataset.toast); close(); }));
  const steps = [...document.querySelectorAll('.step')];
  const mark = () => { const first = steps.find(x => !x.classList.contains('done')); steps.forEach(x => x.classList.toggle('active', x === first)); };
  const pressed = () => steps.forEach(x => x.setAttribute('aria-pressed', String(x.classList.contains('done'))));
  window.stepsConnected = on => { steps.forEach((x, i) => { if (on || i === steps.length - 1) x.classList.toggle('done', on); }); pressed(); mark(); };
  steps.forEach((x, i) => x.addEventListener('click', () => {
    if (i === steps.length - 1) { const c = document.getElementById('connect'); if (c && !c.disabled) c.click(); return; }
    x.classList.toggle('done'); pressed(); mark();
  }));
  window.markStep = i => { if (steps[i]) { steps[i].classList.add('done'); pressed(); mark(); } };
  mark();
})();
</script>
<footer>تم البناء بواسطة <b dir="ltr">Osman</b></footer>
<script>
const $ = id => document.getElementById(id);
const logEl = $('log'), errEl = $('err'), statusEl = $('status');
const MAX = 2000000;
let port = null, reader = null, keepReading = false, text = '', queued = false, atBottom = true;

if (!('serial' in navigator)) {
  errEl.textContent = 'هذا المتصفح لا يدعم Web Serial. استخدم Chrome أو Edge.';
  $('connect').disabled = true;
}

logEl.addEventListener('scroll', () => {
  atBottom = logEl.scrollTop + logEl.clientHeight >= logEl.scrollHeight - 20;
});

function render() {
  queued = false;
  logEl.textContent = text;
  if (atBottom) logEl.scrollTop = logEl.scrollHeight;
}
function append(s) {
  text += s;
  if (text.length > MAX) text = text.slice(-MAX);
  if (!queued) { queued = true; requestAnimationFrame(render); }
}
function setState(on) {
  $('connect').disabled = on;
  if (window.stepsConnected) stepsConnected(on);
  $('disconnect').disabled = !on;
  $('baud').disabled = on;
  $('soc').disabled = on;
  statusEl.className = on ? 'on' : '';
  statusEl.textContent = on ? 'متصل بسرعة ' + $('baud').value : 'غير متصل';
}

async function connect() {
  errEl.textContent = '';
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: Number($('baud').value) });
  } catch (e) {
    if (e.name !== 'NotFoundError') errEl.textContent = 'تعذّر الاتصال: ' + e.message;
    port = null;
    return;
  }
  keepReading = true;
  setState(true);
  toast('تم الاتصال');
  readLoop();
}

async function readLoop() {
  const dec = new TextDecoder();
  while (port && port.readable && keepReading) {
    reader = port.readable.getReader();
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value) append(dec.decode(value, { stream: true }));
      }
    } catch (e) {
      errEl.textContent = 'انقطعت القراءة: ' + e.message;
      keepReading = false;
    } finally {
      reader.releaseLock();
      reader = null;
    }
  }
  try { await port.close(); } catch (e) {}
  port = null;
  setState(false);
  toast('تم قطع الاتصال');
  analyze();
}

async function disconnect() {
  keepReading = false;
  if (reader) { try { await reader.cancel(); } catch (e) {} }
}

if ('serial' in navigator) {
  navigator.serial.addEventListener('disconnect', () => { keepReading = false; });
}

const RULES = [
  { k: /kernel panic/i, t: 'انهيار النواة (Kernel panic)', s: 'راجع الأسطر التي قبل الرسالة مباشرة لمعرفة الوحدة المسببة.' },
  { k: /unable to mount root|cannot open root|mount.*fail/i, t: 'فشل تركيب النظام', s: 'قد تكون الأقسام تالفة أو الذاكرة لا تُقرأ. افحص الأقسام والذاكرة.' },
  { k: /mmc\d?.*(error|timeout|fail)|emmc.*(error|fail)/i, t: 'خطأ في ذاكرة eMMC', s: 'قد يدل على مشكلة في الذاكرة أو اتصالها. افحص الاتصال واللحام قبل أي استبدال.' },
  { k: /i\/o error|buffer i\/o/i, t: 'خطأ إدخال وإخراج', s: 'قد يكون بسبب قسم تالف أو ذاكرة ضعيفة. جرّب فحص القسم المذكور في السجل.' },
  { k: /watchdog|wdt/i, t: 'مؤقت الحماية (Watchdog)', s: 'إعادة تشغيل بسبب تعليق النظام. انظر ما حدث قبلها مباشرة.' },
  { k: /ddr|dram.*(fail|error|training)/i, t: 'مشكلة في الرام', s: 'قد يدل على فشل تهيئة الرام. افحص الاتصال وجرّب إعادة التشغيل.' },
  { k: /thermal|over.?temp/i, t: 'حرارة عالية', s: 'قد يكون الهاتف يطفئ نفسه بسبب الحرارة. افحص حساس الحرارة والبطارية.' },
  { k: /low battery|battery.*(low|critical)/i, t: 'بطارية منخفضة', s: 'جرّب الشحن بشاحن آخر ثم أعد القراءة.' },
  { k: /dm-verity|verified boot|\bavb\b|secure boot/i, t: 'فشل التحقق من الإقلاع', s: 'قد يكون النظام معدّلاً أو تالفاً. قد يحتاج الهاتف إلى إعادة تثبيت النظام.' },
  { k: /segfault|segmentation fault/i, t: 'انهيار برنامج (Segfault)', s: 'ابحث عن اسم البرنامج المنهار في السجل.' },
  { k: /out of memory|oom-killer/i, t: 'نفاد الذاكرة', s: 'قد يكون هناك تطبيق يستهلك الذاكرة، أو الرام فيها مشكلة.' },
  { k: /\b(error|fail(ed|ure)?|fatal)\b/i, t: 'أخطاء عامة', s: 'ابحث عن أول خطأ في السجل، لأنه غالباً سبب ما بعده.' }
];

function setCounts(n) {
  $('tab-an').textContent = 'التحليل' + (n ? ' (' + n + ')' : '');
  $('tab-sg').textContent = 'الاقتراحات' + (n ? ' (' + n + ')' : '');
}
function showTab(which) {
  const an = which === 'an';
  $('tab-an').setAttribute('aria-selected', String(an));
  $('tab-sg').setAttribute('aria-selected', String(!an));
  $('panel-an').hidden = !an;
  $('panel-sg').hidden = an;
}
function analyze() {
  const lines = text.split('\n').filter(l => l.trim());
  const sum = $('summary'), fl = $('findings'), sl = $('suggestions');
  sum.textContent = ''; fl.textContent = ''; sl.textContent = '';
  if (!lines.length) { sum.textContent = 'لا يوجد سجل لتحليله. اقرأ السجل أولاً.'; setCounts(0); return; }
  let found = 0;
  RULES.forEach(r => {
    let n = 0, sample = '';
    lines.forEach(l => { if (r.k.test(l)) { n++; if (!sample) sample = l.trim().slice(0, 160); } });
    if (!n) return;
    found++;
    const li = document.createElement('li');
    const h = document.createElement('strong'); h.textContent = r.t + ' (' + n + ')';
    const c = document.createElement('code'); c.textContent = sample;
    li.append(h, c); fl.append(li);
    const si = document.createElement('li');
    const sh = document.createElement('strong'); sh.textContent = r.t;
    const sp = document.createElement('p'); sp.textContent = r.s;
    si.append(sh, sp); sl.append(si);
  });
  sum.textContent = found
    ? 'عدد الأسطر: ' + lines.length + ' — تم رصد ' + found + ' نوع من الأخطاء. هذه نتيجة مبدئية بالكلمات المفتاحية، والاقتراحات تقديرية.'
    : 'عدد الأسطر: ' + lines.length + ' — لم يُرصد خطأ معروف. إذا استمر العطل، انسخ السجل وحلّله بنموذج ذكاء اصطناعي.';
  setCounts(found);
}
$('tab-an').onclick = () => showTab('an');
$('tab-sg').onclick = () => showTab('sg');
$('analyze').onclick = () => { analyze(); toast('تم تحليل السجل'); };
$('copyai').onclick = async () => {
  const prompt = 'حلّل سجل UART التالي لهاتف أندرويد، وحدد سبب المشكلة وطرق الإصلاح:\n\n' + text.slice(-20000);
  try { await navigator.clipboard.writeText(prompt); errEl.textContent = ''; toast('تم النسخ'); }
  catch (e) { errEl.textContent = 'تعذّر النسخ.'; }
};

$('expand').onclick = () => { const b = document.body.classList.toggle('big'); $('expand').textContent = b ? 'تصغير' : 'تكبير'; };
const updSoc = () => {
  const o = $('soc').selectedOptions[0];
  const note = (o && o.dataset.note) || '', rec = o && o.dataset.baud;
  $('baudhint').textContent = note;
  $('socbar').hidden = !note;
  const show = !!rec && rec !== $('baud').value;
  $('usebaud').hidden = !show;
  if (show) { $('usebaud').textContent = 'استخدم ' + rec; $('usebaud').dataset.baud = rec; }
};
$('soc').onchange = () => { updSoc(); if ($('soc').value && window.markStep) markStep(1); };
$('baud').onchange = () => { updSoc(); if (window.markStep) markStep(2); };
$('usebaud').onclick = () => { $('baud').value = $('usebaud').dataset.baud; updSoc(); if (window.markStep) markStep(2); };
updSoc();
$('connect').onclick = connect;
$('disconnect').onclick = disconnect;
$('clear').onclick = () => { text = ''; render(); };
$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText(text); errEl.textContent = ''; toast('تم النسخ'); }
  catch (e) { errEl.textContent = 'تعذّر النسخ.'; }
};
$('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
  a.download = 'uart-log-' + new Date().toISOString().replace(/[:.]/g, '-') + '.txt';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('تم حفظ الملف');
};
</script>
